---
- name: Check optional Traefik middleware profiles without Docker
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    test_template_dir: "{{ playbook_dir }}/../../roles/docker_traefik/templates/dynamic"
    test_basic: "{{ (lookup('ansible.builtin.template', test_template_dir ~ '/middlewares.yml.j2') | from_yaml).http.middlewares }}"
    test_strict: "{{ (lookup('ansible.builtin.template', test_template_dir ~ '/middlewares-strict.yml.j2') | from_yaml).http.middlewares }}"
  tasks:
    - name: Verify basic compatibility and opt-in strict limits
      ansible.builtin.assert:
        that:
          - test_basic['security-chain'].chain.middlewares == ['security-headers', 'compress']
          - test_basic['security-headers'].headers.contentTypeNosniff
          - test_basic.keys() | intersect(test_strict.keys()) | length == 0
          - >-
            test_strict['strict-chain'].chain.middlewares ==
            ['strict-body-limit', 'strict-rate-limit', 'strict-inflight-limit', 'security-headers']
          - >-
            test_strict['strict-chain'].chain.middlewares |
            difference((test_basic.keys() | list) + (test_strict.keys() | list)) | length == 0
          - test_strict['strict-body-limit'].buffering.maxRequestBodyBytes == 1048576
          - test_strict['strict-rate-limit'].rateLimit == {'average':120, 'period':'1m', 'burst':30}
          - test_strict['strict-inflight-limit'].inFlightReq == {'amount':20, 'sourceCriterion':{'requestHost':true}}
