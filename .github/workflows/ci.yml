name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and ansible-lint
        run: python -m pip install ansible-core ansible-lint

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint .

  sanity:
    name: Ansible sanity tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository as a collection
        uses: actions/checkout@v4
        with:
          path: ansible_collections/system4u/infra

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Run ansible-test sanity
        working-directory: ansible_collections/system4u/infra
        run: ansible-test sanity --docker

  integration-redis-cache:
    name: Redis cache integration test
    runs-on: ubuntu-latest
    needs:
      - lint
      - sanity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and Docker SDK
        run: python -m pip install ansible-core docker

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Redis cache integration test
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: >-
          ansible-playbook
          -i localhost,
          tests/integration/docker_redis_cache.yml

  integration-backend-roles:
    name: MCP and agents runtime integration tests
    runs-on: ubuntu-latest
    needs:
      - lint
      - sanity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and Docker SDK
        run: python -m pip install ansible-core docker

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run MCP server integration test
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: >-
          ansible-playbook
          -i localhost,
          tests/integration/docker_s4u_mcp_server.yml

      - name: Run agents runtime integration test
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
        run: >-
          ansible-playbook
          -i localhost,
          tests/integration/docker_s4u_agents_runtime.yml

  build:
    name: Build collection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build --force
