---
# Deployment-specific MCP server instances.
docker_s4u_mcp_server_instances: []

# Resource naming derived from each instance name.
docker_s4u_mcp_server_container_name_prefix: "s4u-mcp-"
docker_s4u_mcp_server_ingress_network_suffix: "-ingress-net"
docker_s4u_mcp_server_egress_network_suffix: "-egress-net"

docker_s4u_mcp_server_config_container_path: "/app/config"
docker_s4u_mcp_server_config_cleanup: true
docker_s4u_mcp_server_tmpfs:
  - "/tmp:rw,noexec,nosuid,nodev,size=32m"
