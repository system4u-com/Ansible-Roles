---
- name: Validate MCP server instance values
  ansible.builtin.assert:
    that:
      - docker_s4u_mcp_server_instance.name is string
      - docker_s4u_mcp_server_instance.name | length > 0
      - docker_s4u_mcp_server_instance.image is string
      - docker_s4u_mcp_server_instance.image | length > 0
      - docker_s4u_mcp_server_instance.ingress_network is string
      - docker_s4u_mcp_server_instance.ingress_network | length > 0
      - docker_s4u_mcp_server_instance.egress_network is string
      - docker_s4u_mcp_server_instance.egress_network | length > 0
      - docker_s4u_mcp_server_instance.config_source_path is string
      - docker_s4u_mcp_server_instance.config_source_path | length > 0
    fail_msg: "The MCP server instance is missing a required value."

- name: Set MCP server resource names
  ansible.builtin.set_fact:
    docker_s4u_mcp_server_container_name: "{{ docker_s4u_mcp_server_instance.name }}"

- name: Check MCP server frontend ingress network
  community.docker.docker_network_info:
    name: "{{ docker_s4u_mcp_server_instance.ingress_network }}"
  register: docker_s4u_mcp_server_ingress_network_info

- name: Validate MCP server frontend ingress network
  ansible.builtin.assert:
    that:
      - docker_s4u_mcp_server_ingress_network_info.exists
      - docker_s4u_mcp_server_ingress_network_info.network.Internal
    fail_msg: >-
      The MCP server frontend ingress network must already exist and be
      internal. Create it through docker_agentgateway_downstream_networks.

- name: Check MCP server dependency networks
  community.docker.docker_network_info:
    name: "{{ item }}"
  loop: "{{ docker_s4u_mcp_server_instance.dependency_networks | default([]) }}"
  register: docker_s4u_mcp_server_dependency_network_info

- name: Validate MCP server dependency networks
  ansible.builtin.assert:
    that:
      - item.exists
    fail_msg: "Every MCP server dependency network must already exist."
  loop: "{{ docker_s4u_mcp_server_dependency_network_info.results }}"
