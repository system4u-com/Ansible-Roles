---
- name: Initialize MCP server container networks
  ansible.builtin.set_fact:
    docker_s4u_mcp_server_container_networks:
      - name: "{{ docker_s4u_mcp_server_instance.ingress_network }}"
      - name: "{{ docker_s4u_mcp_server_instance.egress_network }}"

- name: Add MCP server dependency networks
  ansible.builtin.set_fact:
    docker_s4u_mcp_server_container_networks: >-
      {{ docker_s4u_mcp_server_container_networks + [{'name': item}] }}
  loop: "{{ docker_s4u_mcp_server_instance.dependency_networks | default([]) }}"

- name: Create MCP server container labels dictionary
  ansible.builtin.include_role:
    name: helper_merge_kv
  vars:
    helper_merge_kv_default: >-
      {{ docker_s4u_mcp_server_instance.labels | default([]) }}
    helper_merge_kv_override: []
    helper_merge_kv_output: docker_s4u_mcp_server_container_labels

- name: Create MCP server container environment dictionary
  ansible.builtin.include_role:
    name: helper_merge_kv
  vars:
    helper_merge_kv_default: >-
      {{ docker_s4u_mcp_server_instance.environment | default([]) }}
    helper_merge_kv_override: []
    helper_merge_kv_output: docker_s4u_mcp_server_container_environment

- name: Add MCP server management labels
  ansible.builtin.set_fact:
    docker_s4u_mcp_server_container_labels: >-
      {{ docker_s4u_mcp_server_container_labels | combine({
        'com.system4u.managed-by': 'system4u.infra.docker_s4u_mcp_server',
        'com.system4u.instance-name': docker_s4u_mcp_server_instance.name,
        'com.system4u.egress-network': docker_s4u_mcp_server_instance.egress_network,
        'com.system4u.data-path': docker_data_basepath ~ '/' ~ docker_s4u_mcp_server_instance.name
      }) }}

- name: Create MCP server container
  community.docker.docker_container:
    docker_host: unix:///var/run/docker.sock
    name: "{{ docker_s4u_mcp_server_container_name }}"
    image: "{{ docker_s4u_mcp_server_instance.image }}"
    pull: true
    recreate: true
    container_default_behavior: "no_defaults"
    networks_cli_compatible: true
    networks: "{{ docker_s4u_mcp_server_container_networks }}"
    env: "{{ docker_s4u_mcp_server_container_environment }}"
    labels: "{{ docker_s4u_mcp_server_container_labels }}"
    command: >-
      {{ docker_s4u_mcp_server_instance.command
      if docker_s4u_mcp_server_instance.command | default([]) | length > 0
      else omit }}
    user: "{{ docker_uid }}:{{ docker_gid }}"
    read_only: true
    security_opts:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs: "{{ docker_s4u_mcp_server_tmpfs }}"
    volumes: >-
      {{ docker_s4u_mcp_server_instance.volumes | default([])
      + [docker_data_basepath ~ '/' ~ docker_s4u_mcp_server_container_name
      ~ '/config:' ~ docker_s4u_mcp_server_config_container_path ~ ':ro'] }}
    restart_policy: unless-stopped
    state: started
  no_log: true
