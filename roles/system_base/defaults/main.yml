---
# Base operating-system packages.
system_base_packages:
  - ca-certificates
  - curl
  - dnsutils
  - gnupg
  - iproute2
  - iputils-ping
  - jq
  - locales
  - netcat-openbsd
  - openssl
  - python3
  - python3-apt
  - python3-jmespath
  - systemd-timesyncd
  - unzip
  - vim

# Shared system configuration.
system_base_timezone: "{{ system_timezone }}"
system_base_locale: "en_US.UTF-8"

# Hostname management is intentionally not part of the standard base setup.
system_base_manage_hostname: false
system_base_hostname: "{{ inventory_hostname }}"

# Optional emergency disk reserve. Delete the file manually to free the space.
system_base_disk_reserve_enabled: false
system_base_disk_reserve_path: "/var/lib/system-base/disk-reserve"
system_base_disk_reserve_size: "1GiB"
