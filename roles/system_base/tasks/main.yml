---
- name: Detect operating system without Python
  ansible.builtin.raw: >-
    if [ -r /etc/os-release ]; then
      . /etc/os-release && printf '%s' "${ID:-}";
    fi
  register: system_base_os_id
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - system_base_os_id.rc == 0
      - system_base_os_id.stdout | trim == 'ubuntu'
    fail_msg: >-
      The system_base role supports Ubuntu only. Detected OS ID:
      {{ system_base_os_id.stdout | trim | default('unknown', true) }}.
  check_mode: false

- name: Check for APT package manager without Python
  ansible.builtin.raw: command -v apt-get
  register: system_base_apt_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate APT package manager
  ansible.builtin.assert:
    that:
      - system_base_apt_check.rc == 0
    fail_msg: "The system_base role requires apt-get on Ubuntu hosts."
  check_mode: false

- name: Check for Python 3 on the managed host
  ansible.builtin.raw: command -v python3
  register: system_base_python_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Bootstrap Python 3 when it is missing
  ansible.builtin.raw: >-
    apt-get update &&
    DEBIAN_FRONTEND=noninteractive apt-get install -y python3
  when: system_base_python_check.rc != 0
  changed_when: true
  check_mode: false

- name: Gather facts after Python bootstrap
  ansible.builtin.setup:

- name: Install base operating-system packages
  ansible.builtin.apt:
    name: "{{ system_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure system timezone
  community.general.timezone:
    name: "{{ system_base_timezone }}"

- name: Generate standard system locale
  community.general.locale_gen:
    name: "{{ system_base_locale }}"
    state: present

- name: Configure default system locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: "LANG={{ system_base_locale }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Configure hostname
  ansible.builtin.hostname:
    name: "{{ system_base_hostname }}"
  when: system_base_manage_hostname | bool

- name: Create emergency disk reserve directory
  ansible.builtin.file:
    path: "{{ system_base_disk_reserve_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: system_base_disk_reserve_enabled | bool

- name: Create emergency disk reserve file
  community.general.filesize:
    path: "{{ system_base_disk_reserve_path }}"
    size: "{{ system_base_disk_reserve_size }}"
    owner: root
    group: root
    mode: "0600"
  when: system_base_disk_reserve_enabled | bool
