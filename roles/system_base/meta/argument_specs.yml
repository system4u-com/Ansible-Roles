---
argument_specs:
  main:
    short_description: Prepare a reusable Linux host
    options:
      system_base_packages:
        type: list
        elements: str
        default:
          - ca-certificates
          - curl
          - dnsutils
          - gnupg
          - iproute2
          - iputils-ping
          - jq
          - locales
          - netcat-openbsd
          - openssl
          - python3
          - python3-apt
          - python3-jmespath
          - systemd-timesyncd
          - unzip
          - vim

      system_base_timezone:
        type: str
        default: "{{ system_timezone }}"

      system_base_locale:
        type: str
        default: en_US.UTF-8

      system_base_manage_hostname:
        type: bool
        default: false

      system_base_hostname:
        type: str
        default: "{{ inventory_hostname }}"

      system_base_disk_reserve_enabled:
        type: bool
        default: false

      system_base_disk_reserve_path:
        type: path
        default: /var/lib/system-base/disk-reserve

      system_base_disk_reserve_size:
        type: str
        default: 1GiB
